<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Simplified area map of Meadowside Clinic near Twickenham Green</title>
  <desc id="mapDesc">Map showing Meadowside Clinic just north of Twickenham Green, between Staines Road (A311) and Hampton Road, with Strawberry Hill Station to the south-east and Twickenham Station to the north-east.</desc>

  <!-- Background -->
  <rect width="800" height="520" fill="#FAF8F3" />

  <!-- Subtle street grid -->
  <g stroke="#E2E7E3" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M 80 80 L 80 450" />
    <path d="M 210 50 L 210 290" />
    <path d="M 590 60 L 590 460" />
    <path d="M 60 140 L 730 140" />
    <path d="M 480 390 L 740 390" />
  </g>

  <!-- Twickenham Green (central green triangle) -->
  <polygon points="220,315 510,275 455,390" fill="#CFE0D5" stroke="#5A836B" stroke-width="3" />
  <text x="385" y="334" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#162B22" text-anchor="middle">Twickenham Green</text>

  <!-- Main Roads -->
  <!-- Staines Road (A311) -->
  <path d="M 40 335 L 220 315 L 510 275 L 760 220" stroke="#D9CBB5" stroke-width="16" fill="none" stroke-linecap="round" />
  <path d="M 40 335 L 220 315 L 510 275 L 760 220" stroke="#F4EFE6" stroke-width="10" fill="none" stroke-linecap="round" />

  <!-- Hampton Road -->
  <path d="M 190 480 L 455 390 L 510 275" stroke="#D9CBB5" stroke-width="14" fill="none" stroke-linecap="round" />
  <path d="M 190 480 L 455 390 L 510 275" stroke="#F4EFE6" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Heath Road / King Street toward Twickenham Centre -->
  <path d="M 510 275 L 760 280" stroke="#D9CBB5" stroke-width="14" fill="none" stroke-linecap="round" />
  <path d="M 510 275 L 760 280" stroke="#F4EFE6" stroke-width="8" fill="none" stroke-linecap="round" />

  <!-- Meadowside Mews (Clinic side street) -->
  <path d="M 330 297 L 330 185 L 430 185" stroke="#214033" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,6" />

  <!-- Road labels -->
  <text x="135" y="310" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#4A5550" transform="rotate(-7 135 310)">Staines Road (A311)</text>
  <text x="300" y="458" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#4A5550" transform="rotate(-19 300 458)">Hampton Road (A311)</text>
  <text x="640" y="266" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#4A5550">Heath Road</text>

  <!-- Bus Stop markers along Staines Road -->
  <g>
    <circle cx="290" cy="306" r="8" fill="#9C523B" stroke="#FFFFFF" stroke-width="2" />
    <text x="290" y="290" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#7D3F2C" text-anchor="middle">Bus Stop (110, 290, 490)</text>
  </g>

  <!-- Rail Stations (directional markers) -->
  <g>
    <rect x="598" y="88" width="176" height="44" rx="8" fill="#FFFFFF" stroke="#214033" stroke-width="2" />
    <text x="686" y="108" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#214033" text-anchor="middle">Twickenham Station</text>
    <text x="686" y="124" font-family="Georgia, serif" font-size="11" fill="#4A5550" text-anchor="middle">Approx. 12 min walk NE</text>
  </g>

  <g>
    <rect x="580" y="425" width="194" height="44" rx="8" fill="#FFFFFF" stroke="#214033" stroke-width="2" />
    <text x="677" y="445" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#214033" text-anchor="middle">Strawberry Hill Station</text>
    <text x="677" y="461" font-family="Georgia, serif" font-size="11" fill="#4A5550" text-anchor="middle">Approx. 10 min walk SE</text>
  </g>

  <!-- Clinic Pin -->
  <g>
    <circle cx="385" cy="185" r="28" fill="#E8EFEA" stroke="#214033" stroke-width="2" />
    <path d="M 385 152 C 371 152 361 162 361 175 C 361 193 385 215 385 215 C 385 215 409 193 409 175 C 409 162 399 152 385 152 Z" fill="#214033" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="385" cy="175" r="7" fill="#FAF8F3" />

    <!-- Label Card -->
    <rect x="260" y="92" width="250" height="50" rx="10" fill="#214033" />
    <text x="385" y="114" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Meadowside Clinic</text>
    <text x="385" y="133" font-family="Georgia, serif" font-size="12" fill="#E8EFEA" text-anchor="middle">Step-free ground-floor entrance</text>
  </g>

  <!-- Compass N -->
  <g transform="translate(56, 56)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#D5DDD7" stroke-width="2" />
    <polygon points="0,-13 5,4 0,0 -5,4" fill="#214033" />
    <text x="0" y="15" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#4A5550" text-anchor="middle">N</text>
  </g>

  <!-- Legend -->
  <g transform="translate(24, 424)">
    <rect x="0" y="0" width="210" height="74" rx="8" fill="#FFFFFF" stroke="#D5DDD7" stroke-width="1.5" />
    <circle cx="20" cy="22" r="7" fill="#214033" />
    <text x="36" y="26" font-family="Georgia, serif" font-size="12" fill="#1E2421">Meadowside Clinic</text>
    <line x1="13" y1="44" x2="27" y2="44" stroke="#214033" stroke-width="3" stroke-dasharray="4,3" />
    <text x="36" y="48" font-family="Georgia, serif" font-size="12" fill="#1E2421">Quiet access lane</text>
    <circle cx="20" cy="62" r="5" fill="#9C523B" />
    <text x="36" y="66" font-family="Georgia, serif" font-size="12" fill="#1E2421">Local bus stop</text>
  </g>
</svg>
