<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="mapTitle mapDesc">
  <title id="mapTitle">Minimal line map of Meadowside Clinic beside Twickenham Green</title>
  <desc id="mapDesc">Minimal architectural street diagram showing Twickenham Green between Staines Road and Hampton Road, with Meadowside Clinic at 14 Meadowside Mews just north of The Green.</desc>

  <!-- Warm Porcelain ground -->
  <rect width="800" height="500" fill="#FAFCFD" />

  <!-- Faint background street grid lines -->
  <g stroke="#E3ECEE" stroke-width="2" fill="none">
    <line x1="48" y1="50" x2="48" y2="440" />
    <line x1="615" y1="50" x2="615" y2="440" />
    <line x1="50" y1="115" x2="750" y2="115" />
    <line x1="50" y1="415" x2="750" y2="415" />
  </g>

  <!-- Twickenham Green (calm Sea-Glass fill) -->
  <polygon points="210,295 535,245 470,385" fill="#EAF3F5" stroke="#12525E" stroke-width="2.2" stroke-linejoin="round" />
  <text x="392" y="322" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#0C3C45" text-anchor="middle">Twickenham Green</text>

  <!-- Primary road strokes (>= 3:1 WCAG non-text contrast on #FAFCFD) -->
  <g fill="none" stroke="#668991" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Staines Road (A311) -->
    <path d="M 45 322 L 210 295 L 535 245 L 755 205" />
    <!-- Hampton Road -->
    <path d="M 190 475 L 470 385 L 535 245" />
    <!-- Heath Road -->
    <path d="M 535 245 L 755 258" />
  </g>

  <!-- Road labels placed clear of strokes -->
  <text x="128" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#456268" text-anchor="middle">Staines Rd (A311)</text>
  <text x="315" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#456268" text-anchor="middle">Hampton Rd</text>
  <text x="692" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#456268" text-anchor="middle">Heath Rd</text>

  <!-- Meadowside Mews pedestrian lane -->
  <path d="M 325 277 L 325 168 L 375 168" fill="none" stroke="#12525E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,6" />

  <!-- Clinic Pin -->
  <circle cx="385" cy="168" r="20" fill="#8A3C54" fill-opacity="0.14" />
  <circle cx="385" cy="168" r="9" fill="#8A3C54" stroke="#FAFCFD" stroke-width="2.5" />

  <!-- Clinic Label Card (completely clear of roads) -->
  <rect x="240" y="64" width="290" height="66" rx="10" fill="#F5F2ED" stroke="#12525E" stroke-width="1.8" />
  <text x="385" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0C3C45" text-anchor="middle">Meadowside Clinic</text>
  <text x="385" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#6E2C40" text-anchor="middle">14 Meadowside Mews, TW2 5QA</text>

  <!-- Minimal Compass -->
  <g transform="translate(72, 74)">
    <circle cx="0" cy="0" r="20" fill="#FAFCFD" stroke="#B4CACE" stroke-width="1.5" />
    <polygon points="0,-11 4.5,3 0,0 -4.5,3" fill="#12525E" />
    <text x="0" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#456268" text-anchor="middle">N</text>
  </g>
</svg>
